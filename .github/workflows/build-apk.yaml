name: Build APK
on:
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - name: Siapkan folder www
        run: |
          mkdir -p www
          cp index.html www/
      - run: '[ -d android ] || npx cap add android'
      - name: Inject permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' $M || sed -i '/<application/i \
            <uses-permission android:name="android.permission.CAMERA" />\
            <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />\
            <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\
            <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />\
            <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />' $M
      - name: Inject scanner module
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'mlkit.vision.DEPENDENCIES' $M || sed -i '/<\/application>/i \
            <meta-data android:name="com.google.mlkit.vision.DEPENDENCIES" android:value="barcode_ui" />' $M
      - name: Buat ikon dan splash
        run: |
          if [ -f assets/icon-only.png ]; then
            npx @capacitor/assets generate --android
          fi
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: kasir-warung-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
